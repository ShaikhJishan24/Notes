        // Constructor Inheritance with Arguments

        class A{
            constructor(name){
                this.Name = name;
            }
        }
        
        class B extends A{
            constructor(name, age){
               super(name)         // It calls the constructor function of class A            
               this.Age = age;
            }
        }

        let obj1 = new B("Kanal", 24);
        
        console.log(obj1)
