<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
    
        .container h1 {
            color: red;
            text-align: center;
            font-weight: 800;
            font-size: 50px;
        }

        .input {
            display: flex;
            margin-top: 50px;
        }

        input {
            height: 40px;
            border-radius: 4px;
        }

        label {
            font-size: 25px;
            font-weight: 600;
        }

        .box1,
        .box2,
        .box3 {
            padding: 40px;
        }
        .button{
            position: relative;
            left: 380px;
            padding: 10px;
            font-size: 20px;
            font-weight: 700;
            color: white;
            background-color: blue;
            border-radius: 4px;
            border: transparent;
            width: 100px;
        }
        
        @media only screen and (max-width: 900px) {

            .box1,
            .box2,
            .box3 {
                padding: 10px;
            }

            .container h1 {
                color: red;
                text-align: center;
                font-weight: 800;
                font-size: 30px;
            }

            input {
                height: 25px;
                border-radius: 4px;
                width: 100px;
            }

            label {
                font-size: 20px;
                font-weight: 600;
            }

        }
    </style>

</head>

<body>

    <div class="container" >
        <div class="row justify-content-evenly" style="margin-top: 100px;" >
            <div class="col-md-8 border border-dark" >
                <h1>Age Calculator</h4>

                    <div class="input justify-content-center">
                        <div class="box1  ">
                            <label for="">Date</label><br>
                            <input type="number" class="mt-2" required><br>
                        </div>

                        <div class="box2  ">
                            <label for="">Month</label><br>
                            <input type="number" class="mt-2"><br>
                        </div>

                        <div class="box3  ">
                            <label for="">Year</label><br>
                            <input type="number" class="mt-2"><br>
                        </div>
                    </div>
                
                
                <button class="button mb-5">Submit</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
