<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Assignment </title>
</head>

<body>

    <label for="inp1">Num1 : </label>
    <input id="inp1" type="text"> <br><br>

    <label for="inp2">Num2 : </label>
    <input id="inp2" type="text"> <br><br>

    <label for="res3">Result : </label>
    <input id="res3" type="text"> <br><br>


    <input type="radio" name="op" id="addi" value="add" onclick="eval()"> Addition
    <input type="radio" name="op" id="multi" value="sub" onclick="eval()"> Substraction

    <script>

        function eval() {
            
            let num1 = +document.getElementById("inp1").value;
            let num2 = +(document.getElementById("inp2").value);

            let operation = document.querySelector('input[name="op"]:checked').value;

            let result;

            if (operation === "add") {
                result = num1 + num2;
            }
            else if (operation === "sub") {
                result = num1 - num2;
            }

            document.getElementById("res3").value = result;
        }

    </script>

</body>

</html>
