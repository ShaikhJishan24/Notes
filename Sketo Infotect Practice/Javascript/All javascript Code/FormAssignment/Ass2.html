<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2</title>
</head>
<!-- Create 3 text box and accept number from user. Create dropdown with option [+,*,/,-]. 
On click of button print result in disabled textbox -->
<body>
    
    <label for="inp1">Num1 : </label>
    <input id="inp1" type="text"> <br><br>

    <label for="inp2">Num2 : </label>
    <input id="inp2" type="text"> <br><br>

    <label for="res">Result : </label>
    <input id="res" type="text" disabled> <br><br>

    <select name="operation" id="dropdown_list" onchange="doOperation()">
        <option value="">select Opeartion</option>
        <option value="add">Addition</option>
        <option value="multi">Multiplication</option>
        <option value="div">Division</option>
        <option value="sub">Substraction</option>
    </select>

    <script>

        function doOperation(){

            let num1 = +document.getElementById("inp1").value;
            let num2 = +document.getElementById("inp2").value;

            let selected_option = document.getElementById("dropdown_list").value;
            let result;

            if(selected_option == "add"){
                result = num1 + num2;
            }
            else if(selected_option == "multi"){
                result = num1 * num2 ;
            }
            else if(selected_option == "div"){
                result = (num1 / num2);
            }
            else{
                result = (num1-num2);
            }   
            
            document.getElementById("res").value = result;
        }
        
    </script>
</body>
</html>
