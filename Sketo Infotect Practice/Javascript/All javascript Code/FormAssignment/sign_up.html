<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up page</title>
    <!-- Registration:
Name type text
Pass word type password
Email  type email
DOB type date
Mobile type  number
Address type text
Education  dropdown
Gender Radio
Hobbies Checkbox

Submit     reset -->
</head>
<body>
    
    <label for="">Name : </label> <input type="text"><br><br>

    <label for="">Password : </label> <input type="password"><br><br>

    <label for="">Email: </label> <input type="email"><br><br>

    <label for="">Date : </label> <input type="date" name="" id=""><br><br>

    <label for="">Mobile Number : </label> <input type="text" onblur="myfunc()" id="mn"><br><br>

    <label for="">Address : </label> <input type="text"><br><br>

    <label for="">Gender :</label> <input type="radio" name="gender" id="">Male <input type="radio" name="gender" id="">Female<br><br>
    
    <label for="">Hobbies : </label> 
    <input type="checkbox" name="hobbies" id="">Singing
    <input type="checkbox" name="hobbies" id="">Dancing
    <input type="checkbox" name="hobbies" id="">Cricket

    <script>

        function myfunc(){
           let ele = document.getElementById("mn").value;
           document.writeln(ele + "</br>");
        }

    </script>

</body>
</html>
