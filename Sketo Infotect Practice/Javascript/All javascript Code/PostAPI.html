<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post API</title>
</head>

<body>
  <script>

    fetch("https://reqres.in/api/users", {
      method: "POST",
      body: JSON.stringify({
        name: "Jishan",
        job: "Computer Engineer"
      }),
      headers: {
        "content-type": "application/json"
      },
    })
      .then(response => {
        return response.json()
      })
      .then(data => {
        console.log(data)
      });

  </script>

</body>

</html>
