<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArrowFunction</title>
</head>

<body>


    <script>
        const myfunc = (name) => {
            console.log(name);
        };

        myfunc("Ajit");
        
        let arr = [1, 2, 3, 4, 5];
        let result = arr.map((n) => n * 2);

        console.log(result);
    </script>


</body>

</html>
