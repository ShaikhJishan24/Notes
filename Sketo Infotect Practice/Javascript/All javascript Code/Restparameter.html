<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Rest Parameter</title>
</head>

<body>
     <script>

          function sum(...args) {
               let result = 0;

               for (let i = 0; i < args.length; i++) {
                    result = result + args[i];
               }

               console.log(result);
          };

          sum(5, 5, 5, 5);





     </script>
</body>

</html>
